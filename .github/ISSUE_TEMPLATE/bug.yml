name: Bug
description: Something broken that is not a calculation result (layout, links, offline, saving).
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the page URL and steps to reproduce.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
